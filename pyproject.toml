[build-system]
# setuptools>=77 is the floor for PEP 639 (`license` as an SPDX string plus
# `license-files`). An older setuptools ERRORS on that spelling rather than warning.
requires = ["setuptools>=77", "setuptools-scm>=8", "setuptools-rust>=1.7"]
build-backend = "setuptools.build_meta"

[project]
name = "cellstream"
description = "Compressed per-cell storage for large single-cell AnnData, built for scattered random access"
readme = "README.md"
# The `<3.13` cap 0.9.1 shipped is LIFTED: it rested on intermittent per-cell write failures read
# as a CPython 3.13 defect, and they were not one -- a path stat() on WekaFS can report a
# stale-SHORT st_size, which hit Python 3.11 HARDER than 3.13 and never hit local ext4 at all
# (fixed in PR #319). CI runs 3.11, 3.12 and 3.13, and the WHEELS cover cp311/cp312/cp313 (see
# release.yml).
# The cp313 wheel became possible when `bitshuffle` -- which publishes no cp313 wheel -- left the
# default dependencies for the `bitshuffle` extra below; nothing on the default install path
# needs it any more.
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex Dobin" }, { name = "Arc Institute" }]
keywords = ["single-cell", "anndata", "h5ad", "compression", "crispr", "dataloader"]
# No `License ::` classifier: PEP 639 deprecates it, and setuptools rejects a project that
# declares both that classifier and the `license` field above.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    # Wheels are Linux x86_64 only; other platforms build from the sdist. See release.yml.
    "Operating System :: POSIX :: Linux",
]
dynamic = ["version"]
dependencies = [
    "anndata>=0.10",
    "h5py>=3.9",
    "hdf5plugin>=6.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "pyarrow>=14",
    "zstandard>=0.22",
]

[project.urls]
Homepage = "https://github.com/ArcInstitute/cellstream"
Repository = "https://github.com/ArcInstitute/cellstream"
Issues = "https://github.com/ArcInstitute/cellstream/issues"
Changelog = "https://github.com/ArcInstitute/cellstream/blob/main/CHANGELOG.md"
"Format specification" = "https://github.com/ArcInstitute/cellstream/blob/main/docs/format.md"

[project.scripts]
cellstream = "cellstream.cli:main"

[project.optional-dependencies]
# `test` and `dev` pull the `bitshuffle` extra through a self-reference rather than a second
# copy of its pin, so the two cannot drift. The suite REQUIRES it: most of tests/v2 writes
# legacy-codec archives, and those tests are deliberately not skip-guarded -- a venv without
# the extra fails them loudly rather than reporting a green run that exercised nothing
# (the same hazard the `cell` extra already poses for tests/cell).
test = ["pytest>=7", "pytest-benchmark", "ruff>=0.5", "cellstream[bitshuffle]"]
dev  = ["pytest>=7", "pytest-benchmark", "ruff>=0.5", "mypy>=1.10", "cellstream[bitshuffle]"]
gpu = [
    "cupy-cuda12x>=13",
    "nvidia-nvcomp-cu12>=4.0,<5.0",
]
mudata = ["mudata>=0.2"]
# Only the PURE-PYTHON pfordelta codec needs pyfastpfor: the Rust extension carries its own
# vendored FastPFor and never calls it. So layout="cell" works out of the box from a wheel,
# and this extra is for the fallback engine (CELLSTREAM_DISABLE_RUST=1). Kept an extra rather
# than a dependency because pyfastpfor has no linux wheel of its own -- installing it compiles
# C++, which no ordinary install should have to do.
#
# NOT a fix for "a platform with no wheel", which an earlier version of this comment claimed:
# pyfastpfor binds the SAME x86 FastPFor, so on aarch64 it is not a pfordelta backend at all.
# The zstd pure-Python path needs nothing extra -- `_import_pyfastpfor` is called only from the
# pfordelta encoder/decoder. (codex round 3.)
cell = ["pyfastpfor>=1.4"]
# The LEGACY bitshuffle codec -- SHX2 shards written before v0.3.0, or a codec name that selects
# it (`v2/writer._V2_BITSHUFFLE_CODECS`). It was a default dependency until #305, and the only
# DEFAULT dependency that publishes no cp313 wheel; nothing on the default path --
# the byte-filter codec, zstd-only, the whole per-cell layout -- uses it. `v2/codec.py` imports
# it lazily and raises an actionable ImportError naming this extra when it is missing. On 3.13
# this extra builds bitshuffle from its sdist (a C compiler), exactly the cost the wheel policy
# keeps off the default install.
bitshuffle = ["bitshuffle>=0.5,<1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cellstream.v2.kernels" = ["*.cu"]

[tool.setuptools_scm]
write_to = "src/cellstream/_version.py"

[tool.pytest.ini_options]
# Scope default collection to tests/, so a bare `pytest` from the repo root runs the
# suite and only the suite. Explicit paths still override it.
testpaths = ["tests"]
# Make the repo root importable so tests/v2/test_dispatcher.py can do
# `from tests.v2.test_reader_cpu import _hand_build_v2_archive` (a helper
# shared across two test modules). Without this, CI fails with
# `ModuleNotFoundError: No module named 'tests'`.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
