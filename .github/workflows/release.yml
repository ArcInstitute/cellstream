name: release

# Builds the release artifacts -- cp311/cp312/cp313 manylinux_2_28 x86_64 wheels plus an sdist --
# and publishes them to PyPI on a pushed `v*` tag.
#
# PUBLICATION IS A SEPARATE, GATED JOB (#306), never a step appended to the build:
#   * `needs:` the build jobs, so nothing publishes that has not passed the rust-availability
#     assert;
#   * a protected `environment:`, so an upload is reviewable before it happens;
#   * trusted publishing (`id-token: write`) rather than a long-lived API token;
#   * `if:` restricted to a PUSHED tag. A `workflow_dispatch` can reach the build and TestPyPI
#     and NOTHING else -- dispatch is what makes this workflow verifiable without burning a
#     version number, and a version can never be re-uploaded to PyPI.
#
# The `github.repository ==` guard on the PyPI job is load-bearing, not decoration. This file
# also lives in the private development repo, which does get `v*` tags of its own; without the
# guard each one would queue a real upload attempt. Positive allowlist, so a fork or a move
# fails CLOSED (publishing stops) rather than open. If the repo is ever renamed, this line
# moves with it -- and so does the PyPI trusted publisher, which binds to
# owner + repo + THIS FILENAME + environment.
#
# Platform scope is deliberate and narrow (#306), and it is NARROWER than "everything else
# builds from the sdist". Getting this wrong in the README is how a package acquires bug reports
# from platforms it never supported, so state it exactly:
#
#   SUPPORTED: Linux x86_64 with SSE4.1, glibc >= 2.28 (the manylinux_2_28 baseline), CPython
#   3.11 to 3.13. The WHEELS cover cp311, cp312 and cp313 (cp313 since #305, below). Keep
#   language support and wheel coverage as two separate facts even now that they coincide --
#   conflating them is what made the block below wrong for months.
#
#   The SSE4.1 part is NOT expressed by the wheel tag -- `manylinux_2_28_x86_64` is a glibc
#   statement only. `rust/build.rs` compiles the vendored FastPFor with `-msse4.1` and
#   `rust/csrc/pfor_shim.cpp` asks the factory for `simdfastpfor256`, so on a pre-SSE4.1 x86_64
#   the wheel installs and the default pfordelta path faults.
#
#   Do NOT reassure anyone with a date. An earlier version of this comment said "every x86_64 CPU
#   since ~2008", which is wrong: AMD's K10 / Phenom II line shipped SSE4a rather than SSE4.1 and
#   AMD only gained SSE4.1 with Bulldozer in 2011, and the early Bonnell Atoms lack it too. The
#   correct instruction to a user is `grep sse4_1 /proc/cpuinfo`. (codex round 3.)
#
#   The sdist ships for archival and for downstream packagers, and it does produce a working,
#   Rust-enabled install on Linux (and macOS) *x86_64 WITH SSE4.1* given BOTH a Rust toolchain and
#   a C++11 compiler -- `rust/build.rs` drives `cc` over the vendored FastPFor, so Rust alone is
#   not enough, and `-msse4.1` is applied on the source path too, so building from source lowers
#   the glibc floor but NOT the ISA floor. The sdist job below smoke-tests exactly one
#   configuration (Ubuntu, cp311); it is not a portability matrix. It is NOT a portability story:
#     * Windows: `import cellstream` fails outright. `cellstream/lock.py` does `import fcntl` at
#       module scope and `cellstream/cell/__init__.py` reaches it through `archive_writer`.
#     * aarch64, including Apple Silicon: the crate compiles, but `rust/src/cell.rs` is
#       `#![cfg(target_arch = "x86_64")]` and `rust/build.rs` skips the vendored FastPFor build
#       off x86 (FastPFor is x86 SIMD). The per-cell entry points are therefore ABSENT:
#       `rust_available()` is False and a per-cell read raises unless the caller opts into the
#       pure-Python fallback. With that opt-in a ZSTD archive decodes and needs no extra
#       (`_import_pyfastpfor` is called only from the pfordelta encoder/decoder), while
#       PFORDELTA -- the default for integer counts -- has no working backend there at all,
#       because its pure-Python path needs `pyfastpfor`, itself a binding to the same x86
#       FastPFor. Do not tell an ARM user to install the `cell` extra. (codex rounds 2 and 3.)
#   Both are documented as unsupported in the README rather than implied to work. (codex.)
#
# What the source build never does is quietly install a pure-Python cellstream whose per-cell
# reads are much slower with no indication: setup.py declares the extension non-optional, so a
# missing toolchain FAILS LOUDLY (#244).
#
# The cp313 WHEEL was absent until #305, for one reason: `bitshuffle` publishes no cp313 wheel, so
# a cp313 build could not offer the ALL-WHEEL dependency install this workflow's
# PIP_ONLY_BINARY=:all: policy requires. #305 took the first of its three options -- bitshuffle is
# now the optional `bitshuffle` extra, imported lazily by the legacy codec alone -- so a default
# install has no dependency without a cp313 wheel, `cp313-*` joined CIBW_BUILD, and the
# CIBW_TEST_COMMAND below asserts that importing the wheel never reaches bitshuffle. (Upstream is
# dormant -- 0.5.2 from 2024-09, its py3.13 issue open since 2025-10 -- so "wait" was not a plan,
# and the policy stays.)
#
# The SECOND blocker recorded here for a while -- an undiagnosed non-deterministic suite failure on
# 3.13, which 0.9.1 acted on by capping `requires-python` at <3.13 -- is GONE, and the diagnosis
# behind it was wrong. The `reorder_frames: in_offsets[-1] != staging file size` failures came from
# sizing a staging file with a path stat(): on WekaFS that can read a stale-SHORT st_size right
# after an append through another fd. Measured over 1500 writes per version, Python 3.11 failed 20
# times, 3.12 8, 3.13 12, and local ext4 zero -- 3.11 was the WORST arm, so this was never about
# the interpreter. Fixed, the cap is lifted, and 3.13 is in the test matrix. The bitshuffle
# sdist-vs-wheel difference that looked like the uncontrolled variable was a red herring.
#
# --- why the build platform is manylinux_2_28 (#297) ---
# This workflow had never once succeeded before #304. It always died in cibuildwheel's
# test-install step, but the cause was the BUILD PLATFORM, not the test: manylinux2014 is no
# longer compatible with this project's current BINARY DEPENDENCY SET.
#   * cibuildwheel 2.x defaults x86_64 to the manylinux2014 (== manylinux_2_17) image -- which
#     is why the produced wheel was tagged `manylinux_2_17_x86_64.manylinux2014_x86_64`;
#   * pip takes the newest satisfying release, and scipy stopped shipping manylinux_2_17 wheels
#     at 1.17.0. So it selected an sdist and meson failed on missing OpenBLAS. That is the
#     traceback, but scipy is not the hard floor;
#   * the hard floor is `hdf5plugin>=6.0`, whose x86_64 wheels are
#     `py3-none-manylinux_2_24_x86_64.manylinux_2_28_x86_64` -- there is NO 2_17 wheel at all.
# So `PIP_ONLY_BINARY=:all:` (the fix guessed in #297) would not have worked either, though not
# for the reason first written: scipy WOULD have backtracked to 1.16.3, which does have a 2_17
# wheel. It is hdf5plugin that has no candidate under a binary-only policy. (codex caught this;
# the first version of this comment blamed scipy alone.)
#
# manylinux_2_28 is therefore a deliberate SUPPORT-POLICY choice, not something the metadata
# forces: hdf5plugin's HARD binary floor is 2_24, current scipy releases carry a 2_27 baseline
# (scipy's own floor is lower -- 1.16.3 still has a 2_17 wheel, which is the whole point above),
# and 2_28 is the modern cibuildwheel image that clears both. A 2_17-tagged wheel of ours would
# not have been a dishonest artifact -- a manylinux tag promises the compatibility of that
# wheel's OWN native code, not that every dependency resolves. Resolution is a separate question.
#
# The cp311/cp312 x86_64 wheels we actually consume from zstandard are manylinux_2_17, and that
# is fine: an older-baseline wheel installs on a newer system. Only the reverse breaks, and
# nothing in the dependency set requires BUILDING in a 2_17 environment. (Scoped deliberately --
# zstandard's newer-interpreter wheels do carry 2_28. bitshuffle used to be named here too; since
# #305 the wheel build never installs it.)
#
# NOT verified locally: the docker socket on the dev host rejects non-root
# (`permission denied ... /var/run/docker.sock`), so `cibuildwheel --platform linux` cannot run
# there and this is verified by `workflow_dispatch` instead.
#
# Release-path actions are pinned to full commit SHAs, not tags (#306): a tag is a moving
# pointer, and this is the workflow that signs and uploads artifacts. The comment after each
# `@sha` records which release it is so a bump is a readable diff.
#
# The RUST TOOLCHAIN is pinned the same way (#310) and by the same argument: `rust-toolchain.toml`
# at the repo root names the exact compiler, and the rustup installer below is fetched by version
# and verified by SHA-256 rather than piped from a URL that always serves the newest build. Both
# the compiler and its installer are inputs to the binary this workflow uploads, so both are
# declared. What is still NOT declared is the crate dependency graph: `rust/Cargo.toml` uses
# ranged versions and `rust/.gitignore` excludes `Cargo.lock`, so a clean build resolves it
# afresh (#321). Say "the toolchain is pinned", never "the build is reproducible". (codex round 1.)
# `pypa/cibuildwheel` remains at v2.21.3 on purpose -- see the note on that pin, and #322.
on:
  push:
    # `v[0-9]*`, not `v*`: a tag like `v` or `version-test` would otherwise reach the release
    # path, build a dev-versioned artifact and queue an irreversible upload. The exact form is
    # then re-checked against the built filenames before the upload (see publish-pypi). (codex.)
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Also publish to TestPyPI (this input can NEVER reach PyPI)"
        type: boolean
        default: false

# Least privilege by default; the jobs that need more opt in. Job-level `permissions` REPLACES
# this block rather than merging with it, which is why the publish jobs restate nothing they do
# not need -- they never check out the repo.
permissions:
  contents: read

jobs:
  wheels:
    name: wheels (cp311, cp312, cp313, manylinux_2_28 x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # setuptools-scm derives the version from tags
      # THE cibuildwheel PIN IS HELD DELIBERATELY, and this is the note the header points at.
      # v2.21.3 is two majors behind current (v4.2.0 as of 2026-08-22). It stays because this is
      # the ONLY cibuildwheel configuration that has ever produced a working wheel in this repo --
      # the workflow was red on every run before #304 -- and because the majors move the parts
      # this job depends on:
      #   * 3.0 switched the default build frontend from `pip wheel` to `build` and stopped
      #     preinstalling setuptools/wheel in the build environment;
      #   * 3.0 also made manylinux_2_28 the default linux image, which would make the
      #     CIBW_MANYLINUX_X86_64_IMAGE line below redundant rather than load-bearing;
      #   * 4.0 added an `abi3audit` pass after the repair step -- a new way for a good wheel to
      #     be rejected.
      # The step-ordering claim under CIBW_TEST_COMMAND cites LINE NUMBERS in v2.21.3's linux.py
      # and is only true for this pin; re-verify it on any bump. A bump therefore wants its own
      # PR and its own `workflow_dispatch` run, not a ride along an unrelated change: two changes
      # in one dispatch make a red run ambiguous. #310 raised the bump alongside the toolchain
      # pin and it was deliberately split out (Alex, 2026-08-22); it is tracked as #322.
      - uses: pypa/cibuildwheel@7940a4c0e76eb2030e473a5f864f291f63ee879b # v2.21.3
        env:
          CIBW_BUILD: "cp311-* cp312-* cp313-*"
          # THE #297 FIX. See the header. Available on this action pin: v2.21.3's
          # pinned_docker_images.cfg already lists manylinux_2_28_x86_64:2024.10.07-1.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_ARCHS_LINUX: x86_64
          CIBW_SKIP: "*-musllinux_*"
          # #310. Two unpinned things used to share this one line: the rustup INSTALLER (a
          # remote script piped straight into a shell, with no checksum) and the TOOLCHAIN it
          # installed (`stable` -- whatever that was on the day the tag was pushed). They were
          # the last unpinned parts of the TOOLCHAIN in the path that produces the published
          # wheels, sitting next to SHA-pinned actions and a pinned manylinux image -- but not
          # the last unpinned INPUTS; see the note in the header about the crate graph. Both are
          # now declared:
          #
          #   * rustup-init 1.29.0 from the VERSIONED archive path, checked against its published
          #     SHA-256 before it is executed. Note what sh.rustup.rs actually serves: a BOOTSTRAP
          #     SHELL SCRIPT which, with no `RUSTUP_VERSION` in the environment, then downloads
          #     `rustup-init` from `.../rustup/dist/<arch>/` -- a moving path. Checksumming that
          #     URL would therefore pin the bootstrap bytes and not the executable they fetch;
          #     `.../rustup/archive/1.29.0/<arch>/rustup-init` plus a hash of the binary pins the
          #     thing that actually runs. The old piped form verified neither. (codex round 4.)
          #   * `--default-toolchain none`, so the installer brings NO compiler, and
          #     `rustup toolchain install` (no argument == the active toolchain) then installs
          #     exactly the one that rust-toolchain.toml at the project root names, with the
          #     components it names. `--no-self-update` keeps rustup itself at the pinned 1.29.0
          #     rather than letting it upgrade mid-build and undo half the pin.
          #
          # This FAILS CLOSED, which is the property worth having: with no default toolchain
          # anywhere in the container, a lost or unreadable rust-toolchain.toml makes rustup
          # refuse outright ("could not choose a version of rustc to run"), so the build dies
          # instead of quietly falling back to `stable`. Verified by rehearsing this exact chain
          # against a throwaway HOME, negative control included.
          #
          # `pwd && ls -l rust-toolchain.toml` is diagnostics, not decoration: the file is
          # resolved from the working directory, so if cibuildwheel ever stops running before_all
          # at the project root the log says which directory it was in and `ls` names the file it
          # could not find, instead of a bare non-zero from rustup.
          #
          # The last three clauses ASSERT rather than print, and the release path needs its own
          # assertion because it is decoupled from `tests`: a tag push runs this workflow and not
          # that one, so the stricter check over there is never reached. `rustup show
          # active-toolchain` is the oracle. Its output proves the channel resolved to an EXACT
          # X.Y.Z (a `channel = "stable"` fails), and that the file which selected it is the one at
          # the project root -- matched by full absolute path, because a suffix match would also
          # accept a nested `rust/rust-toolchain.toml` (codex round 2). The final clause confirms
          # the rustc that will build the extension really is that version. Merely printing
          # `rustc --version`, as the first draft did, would have kept the whole wheel job green
          # against a re-floated channel. (codex round 1.)
          #
          # The line is split at the first space and each half compared WHOLE, because `grep -F`
          # is a substring search (codex round 3). `pwd -P` here and `realpath` in test.yml, and
          # the asymmetry is deliberate: a shell's `pwd -P` can return a `//`-prefixed path where
          # rustup canonicalises to a single slash, but that needs a cwd reached through something
          # like `/proc/self/root`, and this cwd is the container's own `/project` -- a plain path
          # with no symlink and no `//` to normalise, printed two clauses earlier so the log proves
          # it. test.yml's cwd is a checkout path this workflow does not control, so it pays for
          # `realpath`; here the argument holds without adding a binary to the one configuration
          # that has ever produced a working wheel in this repo.
          #
          # NB README.md's source-build guidance still tells a reader to install a toolchain the
          # ordinary way, correctly: that is someone building FROM THE SDIST, which this pin
          # deliberately does not govern -- rust-toolchain.toml is excluded from the archive (see
          # MANIFEST.in). Worded generically because this workflow and README.md BOTH travel
          # verbatim to the public repo (#324), so this explanation must be correct when read
          # from either checkout. A build from a git CHECKOUT through rustup is pinned, because
          # the file is present there; a non-rustup `cargo` ignores the file in every case.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf --retry 5 --retry-connrefused
            https://static.rust-lang.org/rustup/archive/1.29.0/x86_64-unknown-linux-gnu/rustup-init
            -o /tmp/rustup-init &&
            echo '4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10  /tmp/rustup-init'
            | sha256sum -c - &&
            chmod +x /tmp/rustup-init &&
            /tmp/rustup-init -y --profile minimal --default-toolchain none &&
            pwd && ls -l rust-toolchain.toml &&
            RUSTUP_MAX_RETRIES=10 "$HOME/.cargo/bin/rustup" toolchain install --no-self-update &&
            tc=$("$HOME/.cargo/bin/rustup" show active-toolchain) && echo "$tc" &&
            printf '%s\n' "${tc%% *}" | grep -qxE '[0-9]+\.[0-9]+\.[0-9]+(-[^ ]+)?' &&
            [ "${tc#* }" = "(overridden by '$(pwd -P)/rust-toolchain.toml')" ] &&
            "$HOME/.cargo/bin/rustc" --version --verbose | grep -qxF "release: ${tc%%-*}"
          # PIP_ONLY_BINARY=:all: ENFORCES the all-wheel policy the comments above claim.
          # Without it a future dependency could drop its 2_28 wheel, compile from sdist inside
          # the container, and leave this workflow GREEN while the stated policy was violated --
          # the green-that-verified-nothing shape. NB this is the same flag #297 guessed at and
          # that was argued against: as the SOLE fix on manylinux2014 it could not work, because
          # hdf5plugin has no 2_17 wheel to fall back to. AFTER moving to 2_28 it is exactly the
          # right guard. (codex round 2, #304.)
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH" PIP_ONLY_BINARY=:all:'
          # The whole point of #244: fail the build rather than ship a silently degraded wheel.
          # This test runs INSIDE cibuildwheel against the repaired wheel, and in v2.21.3's
          # linux.py the repaired wheel is moved to /output (line 405) only AFTER the test
          # command runs (line 397). So the bytes uploaded below are provably the bytes that
          # passed this assert, and a failed assert leaves nothing to upload at all -- which is
          # also why `if: always()` on the upload step cannot deliver the inspectability it
          # looks like it offers, and was tried and REVERTED in #304. (Those line numbers hold
          # ONLY for the pin above and must be re-checked if it moves. Copilot, #304.)
          #
          # The second clause is #305's guard: the default install must never reach `bitshuffle`.
          # Three regressions, three different catchers, and this assert is the third:
          #   * an eager `import bitshuffle` creeping back into the package, with the extra still
          #     absent from this test environment -- `import cellstream` itself fails, before the
          #     assert ever runs;
          #   * bitshuffle back in `dependencies` -- on cp313 PIP_ONLY_BINARY refuses the install,
          #     since it has no wheel to offer;
          #   * BOTH at once, on cp311/cp312 -- the wheel installs, the eager import succeeds, and
          #     nothing above notices. Only this assert does, and it names the regression. (codex.)
          CIBW_TEST_COMMAND: >-
            python -c "import sys, cellstream; s = cellstream.rust_status(); assert s['available'], s;
            assert 'bitshuffle' not in sys.modules, 'the default install imported bitshuffle (#305)'"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          # `if-no-files-found: error` turns upload-artifact's warn-and-upload-nothing outcome
          # into a FAILURE, so a run cannot report success having shipped no wheel.
          if-no-files-found: error
          name: dist-wheels
          path: ./wheelhouse/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # setuptools-scm derives the version from tags
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist
      # An sdist that omits rust/ is the #244 failure mode in its worst form: it installs fine
      # and every source install is silently pure-Python. setuptools_scm's file finder is what
      # puts rust/ in the archive (it includes git-tracked files), so the archive contents
      # depend on a build-time plugin working -- assert it rather than assume it.
      #
      # `rust/Cargo.lock` is deliberately NOT asserted: `rust/.gitignore` ignores it, as is
      # normal for a library crate, so the git file finder never sees it and no sdist can
      # carry it. Asserting it would fail every release. (Found by building an sdist locally
      # before the first release run, not by CI.)
      - name: Assert the sdist carries the Rust crate and its vendored FastPFor
        run: |
          set -euo pipefail
          # `sdist=$(echo dist/*.tar.gz)` was the first version and it fails CLOSED but obscurely:
          # with an empty dist/ the glob stays literal and tar reports "Cannot open dist/*.tar.gz",
          # and with two archives it becomes one space-separated string tar treats as a single
          # filename. Neither message names the actual problem, which in this job is always "the
          # build produced the wrong number of sdists". nullglob + a count says so. (Copilot.)
          shopt -s nullglob
          found=(dist/*.tar.gz)
          [ "${#found[@]}" -eq 1 ] \
            || { echo "FATAL: expected exactly 1 sdist in dist/, found ${#found[@]}"; exit 1; }
          sdist="${found[0]}"
          echo "sdist: $sdist"
          tar tzf "$sdist" > /tmp/sdist.list
          for want in \
            'rust/Cargo.toml' \
            'rust/build.rs' \
            'rust/src/lib.rs' \
            'rust/csrc/pfor_shim.cpp' \
            'setup.py' \
            'pyproject.toml' \
            'README.md' ; do
            grep -q "/${want}\$" /tmp/sdist.list \
              || { echo "FATAL: sdist is missing ${want}"; exit 1; }
          done
          # The vendored FastPFor C++ the pfordelta codec compiles against. Matched as a tree,
          # not a single file, so a re-vendor that renames files still passes while a DROPPED
          # vendor directory fails.
          grep -qE '/rust/vendor/.+\.(h|hpp|cpp|cc)$' /tmp/sdist.list \
            || { echo "FATAL: sdist carries no vendored FastPFor sources"; exit 1; }
          # The one member that must be ABSENT (#310). rust-toolchain.toml pins the compiler that
          # builds OUR wheels; MANIFEST.in keeps it out of the archive so a build FROM THE SDIST on
          # a machine we do not control keeps using whatever otherwise-compatible rustc that
          # machine already has. (A build from a git checkout through rustup sees the file and is
          # pinned; only the archive is exempt.) Shipping it would turn a soft dependency into a
          # hard one -- a rustup user
          # would pay a toolchain download inside `pip install`, and one who cannot reach
          # static.rust-lang.org would get a hard failure where the build works today. An
          # exclusion nothing checks is an exclusion that silently stops applying, so it is
          # asserted here rather than trusted to MANIFEST.in staying put.
          #
          # Written as an explicit three-way on grep's exit code, not `! grep ... || fail`: the
          # negated form maps BOTH "no match" (1) and "grep itself failed" (>1, e.g. an unreadable
          # list) to success, so this one assertion -- alone among the checks in this step -- would
          # have failed OPEN. The positive greps above fail closed on the same error for free.
          # (codex round 1.)
          grep_rc=0
          grep -qE '(^|/)rust-toolchain\.toml$' /tmp/sdist.list || grep_rc=$?
          case "${grep_rc}" in
            0) echo "FATAL: sdist carries rust-toolchain.toml; MANIFEST.in should exclude it"; exit 1 ;;
            1) ;;
            *) echo "FATAL: grep failed (rc=${grep_rc}) reading /tmp/sdist.list"; exit 1 ;;
          esac
          echo "sdist contents OK ($(wc -l < /tmp/sdist.list) members)"
      # The sdist is what a non-wheel platform actually gets, so install it the way they will.
      # SCOPE: one configuration -- Ubuntu, cp311, x86_64. It proves the archive builds a
      # Rust-enabled install; it is NOT a portability matrix and says nothing about macOS or
      # aarch64.
      #
      # ubuntu-latest ships Rust (1.97.1 on the 24.04 image) and a C++ compiler, both of which
      # build.rs needs; if that ever stops being true this job goes RED (setup.py declares the
      # extension non-optional) rather than producing a silently slow install.
      #
      # Deliberately NOT under PIP_ONLY_BINARY=:all: -- that flag would refuse the sdist itself.
      # The all-wheel DEPENDENCY policy is enforced where it belongs, in the wheels job's
      # cibuildwheel test install; what this step exists to prove is narrower and new: that a
      # source build off this archive produces a Rust-enabled install.
      - name: Install the sdist and assert the Rust extension built
        run: |
          set -euo pipefail
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/python -m pip install --upgrade pip
          /tmp/sdist-venv/bin/pip install dist/*.tar.gz
          /tmp/sdist-venv/bin/python -c "import cellstream; s = cellstream.rust_status(); assert s['available'], s; print(s)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: error
          name: dist-sdist
          path: ./dist/*.tar.gz

  # A rehearsal of the upload path against a scratch index. TestPyPI is reachable ONLY from a
  # deliberate `workflow_dispatch` with the input set, and PyPI is reachable ONLY from a pushed
  # tag -- the two are mutually exclusive by construction, so no dispatch can ever upload a real
  # release. `skip-existing` because a dry run is expected to be repeated.
  #
  # The repository guard matters MORE here than on the PyPI job, not less. TestPyPI is a public
  # index, and an sdist built in the private development repo contains every tracked file --
  # setuptools_scm's file finder does not know about the seed plan. A dispatch there would
  # publish the internal trees that this whole launch exists to keep out. (codex, high.)
  publish-testpypi:
    name: publish to TestPyPI (dry run)
    needs: [wheels, sdist]
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.testpypi
      && github.repository == 'ArcInstitute/cellstream'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - run: ls -l dist
      # Dispatched from an UNTAGGED ref, setuptools_scm yields a `.devN+g<sha>` LOCAL version
      # (PEP 440), which PyPI and TestPyPI both reject (a private index may not). The exact
      # string depends on the most recent tag -- it was `0.1.devN+g<sha>` before the first tag
      # existed and derives from the latest release now -- but the `+` local segment is what
      # makes it unpublishable either way. Say that here instead of letting the upload fail
      # with a message about the wrong thing. Dispatch the workflow on the tag ref
      # (`gh workflow run release.yml --ref vX.Y.Z -f testpypi=true`) to rehearse a real version.
      - name: Refuse a local version
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          [ "${#files[@]}" -gt 0 ] || { echo "FATAL: no artifacts to publish"; exit 1; }
          for f in "${files[@]}"; do
            case "$(basename "$f")" in
              *+*) echo "FATAL: $(basename "$f") carries a PEP 440 local version."
                   echo "       Dispatch on a tag ref so setuptools_scm sees a release version."
                   exit 1 ;;
              *) echo "ok   $(basename "$f")" ;;
            esac
          done
      # The `validate` job below is push-only by design, so a DISPATCH skips it -- and the
      # documented rehearsal is a dispatch on a tag ref. Without this, rehearsing an accidentally
      # tagged commit uploads a release to TestPyPI whose changelog describes a different one, and
      # TestPyPI will not accept that version again either. So the changelog check is repeated
      # here. The version comes from the SDIST FILENAME rather than the tag, which makes the step
      # work for every dispatch; the step above has already refused a `+local` version, so what
      # reaches here is a real release version. (codex, checkpoint 2.)
      - name: The shipped CHANGELOG must name the version being uploaded
        run: |
          set -euo pipefail
          shopt -s nullglob
          sdists=(dist/cellstream-*.tar.gz)
          [ "${#sdists[@]}" -eq 1 ] || {
            echo "FATAL: expected exactly 1 sdist, got ${#sdists[@]}"; exit 1; }
          base="$(basename "${sdists[0]}")"
          expected="${base#cellstream-}"; expected="${expected%.tar.gz}"
          # Canonical X.Y.Z, leading zeroes rejected -- the same shape `validate` requires and the
          # same one the seed gate requires of the changelog heading, so all three agree on what a
          # release version IS.
          [[ "$expected" =~ ^(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}$ ]] \
            || { echo "FATAL: '$expected' is not a canonical X.Y.Z version"; exit 1; }
          # On a TAG ref -- the documented rehearsal -- the tag and the artifacts must name the
          # same release. On any other ref the step above has already refused the `+local` version
          # this would otherwise carry, so there is nothing to compare against.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME:-}" != "v$expected" ]; then
            echo "FATAL: dispatched on tag ${GITHUB_REF_NAME} but the sdist is $expected"; exit 1
          fi
          # Every artifact must carry THIS version. Without it a stray `cellstream-0.9.3-*.whl`
          # with no `+` passes every other check here and gets uploaded alongside the 0.9.2 sdist.
          # This is a version-agreement check only -- it deliberately does NOT re-check the exact
          # cp311/cp312/cp313 ABI set or the cardinality. `validate` owns that policy for the path
          # that reaches PyPI, and a third copy of that loop would trade a rehearsal-index check for
          # exactly the divergence risk this file already guards against. (codex round 4.)
          # `files` is re-collected HERE: every `run:` block is its own shell, so the array the
          # step above built is gone. Populating it there and looping here silently iterated
          # nothing -- caught by running this step against a fixture directory. (codex round 4.)
          all=(dist/*)
          [ "${#all[@]}" -gt 0 ] || { echo "FATAL: no artifacts to publish"; exit 1; }
          for f in "${all[@]}"; do
            b="$(basename "$f")"
            case "$b" in
              cellstream-"$expected".tar.gz|cellstream-"$expected"-*.whl) ;;
              *) echo "FATAL: $b does not carry version $expected"; exit 1 ;;
            esac
          done
          if ! changelog="$(tar -xzOf "${sdists[0]}" "cellstream-$expected/CHANGELOG.md" \
                              2>/dev/null)"; then
            echo "FATAL: the sdist carries no CHANGELOG.md"; exit 1
          fi
          # Newest `## [...]` heading. 0-3 spaces of indent is a heading and 4+ is an indented
          # code block; a fence is closed only by the same character, at least as many of them,
          # and nothing else on the line -- SPACES AND TABS only, because `[[:space:]]` also
          # matches Unicode spaces in a UTF-8 locale and the pre-publication reader does not.
          # Records are split on CR too: awk breaks records on LF alone, so a bare CR would keep
          # a heading joined to the previous line here while the other reader saw two lines.
          # A heading must also CLOSE its bracket: matching `^## \[` alone marked a malformed
          # `## [no-close` line as found and suppressed the real heading below it, so a changelog
          # the pre-publication check approved failed here instead. All three divergences were
          # found by differential probing. It does NOT
          # `exit` after the first match -- awk exiting early leaves the upstream `printf` writing
          # into a closed pipe, and under `set -o pipefail` that intermittently kills the job with
          # 141 on a changelog larger than the pipe buffer. Reproduced; the fix is to consume all
          # input. (codex, checkpoint 2.)
          top="$(printf '%s\n' "$changelog" | awk '
            function scan(s,   c, k, info, ind) {
              ind = 0
              while (ind < 4 && substr(s, ind + 1, 1) == " ") ind++
              if (ind >= 4) return
              s = substr(s, ind + 1)
              c = substr(s, 1, 1)
              if (c == "`" || c == "~") {
                k = 0
                while (substr(s, k + 1, 1) == c) k++
                if (k >= 3) {
                  info = substr(s, k + 1)
                  if (fence == "") {
                    if (!(c == "`" && index(info, "`") > 0)) { fence = c; flen = k }
                  } else if (c == fence && k >= flen && info ~ /^[ \t]*$/) {
                    fence = ""; flen = 0
                  }
                  return
                }
              }
              if (fence != "") return
              if (!got && s ~ /^## \[[^]]*\]/) { print s; got = 1 }
            }
            { np = split($0, parts, /\r/); for (ip = 1; ip <= np; ip++) scan(parts[ip]) }
            ' | sed -n 's/^## \[\([^]]*\)\].*/\1/p')"
          [ -n "$top" ] || { echo "FATAL: the shipped CHANGELOG.md has no '## [...]' heading"; exit 1; }
          [ "$top" = "$expected" ] || {
            echo "FATAL: uploading $expected but the shipped CHANGELOG's newest entry is [$top]"
            exit 1
          }
          echo "ok   the shipped CHANGELOG's newest entry is [$top]"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # Tag/artifact validation lives in its OWN unprivileged job, ahead of the protected
  # environment, for two reasons (codex round 2):
  #
  #   * the trigger pattern `v[0-9]*` still admits `v0.9`, `v0.9.0rc1` and `v0anything`. With the
  #     check inside publish-pypi, such a tag ENTERS the `pypi` environment -- asking a human for
  #     a deployment approval -- and only then fails. The approval prompt should mean "this is a
  #     release", so the thing that decides that must run first.
  #   * this job needs no `id-token: write` and no environment, so the strict check runs with no
  #     publishing capability at all.
  #
  # It carries the same guards as publish-pypi. When it is SKIPPED (a dispatch, or the private
  # development repo) publish-pypi is skipped with it, since a skipped `needs` skips the dependent
  # job -- which is the intended behaviour in both cases.
  validate:
    name: validate the release tag against the artifacts
    needs: [wheels, sdist]
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
      && github.repository == 'ArcInstitute/cellstream'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - run: ls -l dist
      # The check that ties the tag to the bytes. setuptools_scm derives the version FROM the tag,
      # so the two agreeing is the whole premise -- but a shallow checkout, a missing tag fetch, or
      # a tag pushed to the wrong commit all silently produce a dev version instead, and PyPI would
      # either reject it confusingly or accept a version nobody meant to release.
      #
      # The tag arrives through `env:` rather than being interpolated into the script. A tag name
      # is repository-writer-controlled text, and `${{ }}` inside `run:` is textual substitution.
      - name: The artifacts must carry exactly the tag's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected="${TAG#v}"
          echo "tag=$TAG  expected version=$expected"
          # A release tag must name a release: X.Y.Z, no .devN, no pre/post segment, no local
          # `+` part. Anything else is an accident that should not reach PyPI.
          # Canonical: leading zeroes rejected, because packaging normalises `01.02.003` to
          # `1.2.3` and the tag would then not name the version that ships. The same shape the
          # TestPyPI step and the pre-publication changelog check require. (codex round 4.)
          [[ "$expected" =~ ^(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}$ ]] \
            || { echo "FATAL: '$TAG' is not a canonical vX.Y.Z release tag"; exit 1; }
          shopt -s nullglob
          files=(dist/*)
          [ "${#files[@]}" -gt 0 ] || { echo "FATAL: no artifacts to publish"; exit 1; }
          # Count the wheels PER INTERPRETER, not in total. `>= 2 wheels` was the first version of
          # this check and it accepted two cp311 wheels, a stray cp310, or an aarch64 build --
          # "two of something" is not the promised set. CIBW_BUILD is exactly
          # `cp311-* cp312-* cp313-*` on x86_64, so the promised set is exactly one of each.
          # (codex round 3; cp313 added by #305.)
          cp311=0 cp312=0 cp313=0 sdists=0
          for f in "${files[@]}"; do
            b="$(basename "$f")"
            case "$b" in
              cellstream-"$expected".tar.gz) echo "ok   $b"; sdists=$((sdists + 1)) ;;
              cellstream-"$expected"-cp311-cp311-*manylinux*x86_64.whl)
                echo "ok   $b"; cp311=$((cp311 + 1)) ;;
              cellstream-"$expected"-cp312-cp312-*manylinux*x86_64.whl)
                echo "ok   $b"; cp312=$((cp312 + 1)) ;;
              cellstream-"$expected"-cp313-cp313-*manylinux*x86_64.whl)
                echo "ok   $b"; cp313=$((cp313 + 1)) ;;
              *) echo "FATAL: $b is not one of this release's promised artifacts"; exit 1 ;;
            esac
          done
          # `*manylinux*x86_64` rather than a literal `manylinux_2_28_x86_64`: auditwheel chooses
          # the tag from what the binary actually requires and can emit a compound alias, and this
          # is not the place to bet a release on a filename nobody has read yet. The glob still
          # rejects a bare `linux_x86_64` (unrepaired), a musllinux wheel and any non-x86_64 arch.
          [ "$cp311" -eq 1 ] || { echo "FATAL: expected exactly 1 cp311 wheel, got $cp311"; exit 1; }
          [ "$cp312" -eq 1 ] || { echo "FATAL: expected exactly 1 cp312 wheel, got $cp312"; exit 1; }
          [ "$cp313" -eq 1 ] || { echo "FATAL: expected exactly 1 cp313 wheel, got $cp313"; exit 1; }
          [ "$sdists" -eq 1 ] || { echo "FATAL: expected exactly 1 sdist, got $sdists"; exit 1; }
          # Everything above ties the tag to the BYTES. Nothing tied it to what those bytes SAY:
          # setuptools_scm derives the version from the tag, so a mistyped `v0.9.3` builds, passes
          # every check above and publishes 0.9.3 carrying a CHANGELOG whose newest entry is
          # 0.9.2 -- a release that describes a different release. Read the changelog OUT OF THE
          # SDIST rather than out of a checkout: the artifact is what ships, and this job does not
          # check out the repository at all.
          if ! changelog="$(tar -xzOf "dist/cellstream-$expected.tar.gz" \
                              "cellstream-$expected/CHANGELOG.md" 2>/dev/null)"; then
            echo "FATAL: the sdist carries no CHANGELOG.md"; exit 1
          fi
          # Newest `## [...]` heading. 0-3 spaces of indent is a heading and 4+ is an indented
          # code block; a fence is closed only by the same character, at least as many of them,
          # and nothing else on the line -- SPACES AND TABS only, because `[[:space:]]` also
          # matches Unicode spaces in a UTF-8 locale and the pre-publication reader does not.
          # Records are split on CR too: awk breaks records on LF alone, so a bare CR would keep
          # a heading joined to the previous line here while the other reader saw two lines.
          # A heading must also CLOSE its bracket: matching `^## \[` alone marked a malformed
          # `## [no-close` line as found and suppressed the real heading below it, so a changelog
          # the pre-publication check approved failed here instead. All three divergences were
          # found by differential probing. It does NOT
          # `exit` after the first match -- awk exiting early leaves the upstream `printf` writing
          # into a closed pipe, and under `set -o pipefail` that intermittently kills the job with
          # 141 on a changelog larger than the pipe buffer. Reproduced; the fix is to consume all
          # input. (codex, checkpoint 2.)
          top="$(printf '%s\n' "$changelog" | awk '
            function scan(s,   c, k, info, ind) {
              ind = 0
              while (ind < 4 && substr(s, ind + 1, 1) == " ") ind++
              if (ind >= 4) return
              s = substr(s, ind + 1)
              c = substr(s, 1, 1)
              if (c == "`" || c == "~") {
                k = 0
                while (substr(s, k + 1, 1) == c) k++
                if (k >= 3) {
                  info = substr(s, k + 1)
                  if (fence == "") {
                    if (!(c == "`" && index(info, "`") > 0)) { fence = c; flen = k }
                  } else if (c == fence && k >= flen && info ~ /^[ \t]*$/) {
                    fence = ""; flen = 0
                  }
                  return
                }
              }
              if (fence != "") return
              if (!got && s ~ /^## \[[^]]*\]/) { print s; got = 1 }
            }
            { np = split($0, parts, /\r/); for (ip = 1; ip <= np; ip++) scan(parts[ip]) }
            ' | sed -n 's/^## \[\([^]]*\)\].*/\1/p')"
          [ -n "$top" ] || { echo "FATAL: the shipped CHANGELOG.md has no '## [...]' heading"; exit 1; }
          [ "$top" = "$expected" ] || {
            echo "FATAL: the tag says $expected but the shipped CHANGELOG's newest entry is [$top]"
            echo "       (an [Unreleased] heading here means this commit was never cut as a release)"
            exit 1
          }
          echo "ok   the shipped CHANGELOG's newest entry is [$top]"
          echo "validated: cp311 + cp312 + cp313 wheels + 1 sdist + CHANGELOG, all at $expected"

  publish-pypi:
    name: publish to PyPI
    needs: [wheels, sdist, validate]
    # A PUSHED tag only -- see the header. The repository guard keeps this inert in the private
    # development repo, which tags releases of its own. `validate` above carries the same guards
    # and has already proved the tag names a release and the artifacts match it.
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
      && github.repository == 'ArcInstitute/cellstream'
    runs-on: ubuntu-latest
    # A PROTECTED environment: with a required reviewer configured, the job waits for a human
    # before uploading. PyPI never lets a version be re-uploaded, so this pause is the only
    # place a mistake is still recoverable.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - run: ls -l dist
      # No `skip-existing`: on a real release an already-present file means the tag is being
      # re-published, and that should fail loudly rather than be shrugged off.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
