[package]
name = "cellstream-rust"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
zstd = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = "thin"
